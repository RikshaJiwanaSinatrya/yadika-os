# Drop-in autologin untuk getty@tty1.
# Pasang di: /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# Dipakai sebagai jalur maintenance: saat kiosk.service dimatikan,
# boot akan otomatis login user kiosk di tty1 tanpa password.
# Saat kiosk.service aktif, unit tersebut mengambil alih tty1
# (Conflicts=getty@tty1) sehingga drop-in ini tidak berefek.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin kiosk --noclear %I $TERM
